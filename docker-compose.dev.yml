services:
  backend:
    build:
      context: ./rest
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./rest:/app
      - ./data:/app/data
      - maven-repo:/root/.m2
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/auth/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: development
    ports: !override
      - "3000:3000"
    environment:
      - VITE_BACKEND_URL=http://backend:8080
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  maven-repo:
