apiVersion: v1
kind: ConfigMap
metadata:
  name: shellspell-config
  namespace: shellspell
data:
  # Database configuration
  POSTGRES_DB: "shellspell"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://shellspell-db:5432/shellspell"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  # JWT token expiration (24h in milliseconds)
  JWT_EXPIRATION_MS: "86400000"
