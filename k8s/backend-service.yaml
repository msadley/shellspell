apiVersion: v1
kind: Service
metadata:
  name: shellspell-backend
  namespace: shellspell
spec:
  type: ClusterIP
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: shellspell-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# Compatibility service for internal requests referring to "backend"
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: shellspell
  labels:
    app.kubernetes.io/name: shellspell-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: shellspell
spec:
  type: ClusterIP
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: shellspell-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
