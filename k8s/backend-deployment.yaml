apiVersion: apps/v1
kind: Deployment
metadata:
  name: shellspell-backend
  namespace: shellspell
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shellspell-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shellspell-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: shellspell
    spec:
      initContainers:
        # Replaces docker-compose 'depends_on: db: condition: service_healthy'
        - name: wait-for-db
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for PostgreSQL (shellspell-db:5432) to be available..."
              until nc -z -w3 shellspell-db 5432; do
                sleep 2
              done
              echo "PostgreSQL is reachable!"
      containers:
        - name: backend
          image: shellspell-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: shellspell-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: shellspell-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shellspell-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              valueFrom:
                configMapKeyRef:
                  name: shellspell-config
                  key: SPRING_JPA_HIBERNATE_DDL_AUTO
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shellspell-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRATION_MS
              valueFrom:
                configMapKeyRef:
                  name: shellspell-config
                  key: JWT_EXPIRATION_MS
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          startupProbe:
            httpGet:
              path: /api/auth/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /api/auth/health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/auth/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
