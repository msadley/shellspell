apiVersion: v1
kind: Service
metadata:
  name: shellspell-db
  namespace: shellspell
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shellspell-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# Compatibility service for containers configured with host "db"
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: shellspell
  labels:
    app.kubernetes.io/name: shellspell-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: shellspell
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shellspell-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
