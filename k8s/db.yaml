apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: shellspell
type: kubernetes.io/basic-auth
stringData:
  username: shellspell
  password: shellspell
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: db
  namespace: shellspell
spec:
  # Increase instances to 2 or 3 for High Availability (HA) replication
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:15
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: shellspell
      owner: shellspell
      secret:
        name: db-credentials
---
# Compatibility alias routing "db:5432" to the CloudNativePG primary "db-rw:5432"
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: shellspell
spec:
  type: ExternalName
  externalName: db-rw.shellspell.svc.cluster.local
  ports:
    - port: 5432
