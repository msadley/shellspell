apiVersion: apps/v1
kind: Deployment
metadata:
  name: shellspell-frontend
  namespace: shellspell
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shellspell-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shellspell-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: shellspell
    spec:
      containers:
        - name: frontend
          image: shellspell-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: nginx-config
          configMap:
            name: shellspell-frontend-nginx
            items:
              - key: default.conf
                path: default.conf
