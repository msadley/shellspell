apiVersion: v1
kind: ConfigMap
metadata:
  name: shellspell-frontend-nginx
  namespace: shellspell
  labels:
    app.kubernetes.io/name: shellspell-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: shellspell
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Proxy API requests to backend service
        location /api {
            proxy_pass http://shellspell-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Support Server-Sent Events (SSE) buffering disabled
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
        }
    }
